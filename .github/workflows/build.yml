name: Build

on:
  push:
    paths:
      - theme.css
      - inspector.css
      - scripts/build.sh
      - scripts/overlay.sh
      - scripts/resolve.sh
      - scripts/screenshot.sh
      - scripts/screenshot.mjs
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      hue:
        description: theme hue
        required: false
        type: number
        default: 270
      hue_error:
        description: error hue
        required: false
        type: number
        default: 10
      hue_blue:
        description: blue hue
        required: false
        type: number
        default: 220
      hue_green:
        description: green hue
        required: false
        type: number
        default: 140
      hue_orange:
        description: orange hue
        required: false
        type: number
        default: 30
      hue_yellow:
        description: yellow hue
        required: false
        type: number
        default: 50
      hue_cyan:
        description: cyan hue
        required: false
        type: number
        default: 190
      hue_pink:
        description: pink hue
        required: false
        type: number
        default: 330
      spread:
        description: chrome hue spread
        required: false
        type: number
        default: 20
      sat:
        description: saturation 0-100
        required: false
        type: number
        default: 50
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CHANNEL: stable
  SAT: ${{ github.event.inputs.sat }}
  HUE: ${{ github.event.inputs.hue }}
  HUE_ERROR: ${{ github.event.inputs.hue_error }}
  HUE_BLUE: ${{ github.event.inputs.hue_blue }}
  HUE_GREEN: ${{ github.event.inputs.hue_green }}
  HUE_ORANGE: ${{ github.event.inputs.hue_orange }}
  HUE_YELLOW: ${{ github.event.inputs.hue_yellow }}
  HUE_CYAN: ${{ github.event.inputs.hue_cyan }}
  HUE_PINK: ${{ github.event.inputs.hue_pink }}
  SPREAD: ${{ github.event.inputs.spread }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      skip: ${{ steps.check.outputs.skip }}
      chrome: ${{ steps.resolve.outputs.chrome }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        name: resolve
        run: scripts/resolve.sh

      - id: check
        name: Skip schedule if ref unchanged
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          skip=false
          git fetch origin tag nightly --force || true
          last=$(git tag -l --format='%(contents:subject)' nightly)
          [[ $EVENT == schedule && -n $last && ${last%% *} == "$REF" ]] && skip=true
          printf 'skip=%s\n' "$skip" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        name: setup cache
        with:
          path: ${{ runner.temp }}/devtools-work
          key: work-${{ needs.resolve.outputs.ref }}-${{ hashFiles('scripts/build.sh') }}

      - id: build
        name: build
        run: scripts/build.sh
        env:
          REF: ${{ needs.resolve.outputs.ref }}
          WORK: ${{ runner.temp }}/devtools-work
          ARTIFACT: ${{ runner.temp }}/devtools-frontend.tar.zst

      - uses: actions/upload-artifact@v7
        name: upload artifact
        with:
          name: devtools-frontend.tar.zst
          archive: false
          if-no-files-found: error
          path: ${{ runner.temp }}/devtools-frontend.tar.zst

      - name: tag nightly
        env:
          SHA: ${{ steps.build.outputs.sha }}
          REF: ${{ needs.resolve.outputs.ref }}
          CHROME: ${{ needs.resolve.outputs.chrome || steps.build.outputs.chrome }}
        run: |
          git -c user.name=github-actions[bot] -c user.email=github-actions[bot]@users.noreply.github.com \
            tag -a -f nightly "$GITHUB_SHA" -m "$(printf '%s chromium@%s\n\n%s\n%s\n' \
              "$REF" "$CHROME" "$SHA" \
              "$(git log -1 --format=%s "$GITHUB_SHA")")"
          git push -f origin refs/tags/nightly

  screenshot:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v8
        name: download artifact
        with:
          name: devtools-frontend.tar.zst
          path: ${{ runner.temp }}

      - name: extract artifact
        run: tar -xaf ${{ runner.temp }}/devtools-frontend.tar.zst -C ${{ runner.temp }}

      - name: capture screenshot
        env:
          SAT: 50
          SPREAD: 20
          HUES: 80 180 250 280 320 10
          BROWSER: google-chrome-stable
        run: scripts/screenshot.sh ${{ runner.temp }}/front_end

      - name: publish screenshots
        run: |
          dest=$(mktemp -d)
          cp .github/assets/screenshot-*.png "$dest/"

          git fetch origin screenshots:refs/tmp/screenshots 2>/dev/null || true
          if git rev-parse --verify refs/tmp/screenshots >/dev/null 2>&1; then
            old=$(mktemp -d)
            git archive refs/tmp/screenshots | tar -C "$old" -xf -
            diff -q "$dest" "$old" >/dev/null && exit 0
          fi

          git -C "$dest" init --initial-branch=screenshots
          git -C "$dest" add screenshot-*.png
          git -C "$dest" -c user.name=github-actions[bot] \
            -c user.email=github-actions[bot]@users.noreply.github.com \
            commit -m "$(cat <<'EOF'
          Update DevTools screenshots.

          EOF
          )"
          git fetch "$dest" HEAD
          git push -f origin FETCH_HEAD:refs/heads/screenshots

      - name: publish readme
        run: |
          git diff --quiet HEAD -- README.md && exit 0
          git add README.md
          git -c user.name=github-actions[bot] \
            -c user.email=github-actions[bot]@users.noreply.github.com \
            commit -m "$(cat <<'EOF'
          Update screenshot gallery.

          EOF
          )"
          git push
