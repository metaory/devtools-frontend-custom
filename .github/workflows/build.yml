name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/devtools-work
          key: work-${{ hashFiles('upstream', 'scripts/build.sh') }}

      - id: build
        run: scripts/build.sh
        env:
          WORK: ${{ runner.temp }}/devtools-work
          ARTIFACT: ${{ runner.temp }}/devtools-frontend.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          if-no-files-found: error
          path: ${{ runner.temp }}/devtools-frontend.tar.zst

      - run: |
          git -c user.name=github-actions[bot] -c user.email=github-actions[bot]@users.noreply.github.com \
            tag -a -f nightly "$GITHUB_SHA" -m "$(< upstream) chromium@${{ steps.build.outputs.chrome }}"
          git push -f origin refs/tags/nightly
