name: Build

on:
  push:
    paths:
      - theme.css
      - upstream
      - scripts/build.sh
      - scripts/pin.sh
      - scripts/screenshot.sh
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      upstream:
        description: stable, beta, canary, main, or a git ref
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      chrome: ${{ steps.pin.outputs.chrome }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - id: pin
        run: scripts/pin.sh
        env:
          UPSTREAM: ${{ github.event.inputs.upstream }}

      - id: check
        name: Skip schedule if ref unchanged
        env:
          REF: ${{ steps.pin.outputs.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          git fetch origin tag nightly --force || true
          last=$(git tag -l --format='%(contents:subject)' nightly)
          [[ $EVENT == schedule && -n $last && ${last%% *} == "$REF" ]] && skip=true
          printf 'skip=%s\n' "$skip" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: pin
    if: needs.pin.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/devtools-work
          key: work-${{ needs.pin.outputs.ref }}-${{ hashFiles('scripts/build.sh') }}

      - id: build
        run: scripts/build.sh
        env:
          WORK: ${{ runner.temp }}/devtools-work
          ARTIFACT: ${{ runner.temp }}/devtools-frontend.tar.zst
          REF: ${{ needs.pin.outputs.ref }}

      - uses: actions/upload-artifact@v7
        with:
          name: devtools-frontend.tar.zst
          archive: false
          if-no-files-found: error
          path: ${{ runner.temp }}/devtools-frontend.tar.zst

      - name: Tag nightly
        env:
          REF: ${{ needs.pin.outputs.ref }}
          SHA: ${{ steps.build.outputs.sha }}
          CHROME: ${{ needs.pin.outputs.chrome || steps.build.outputs.chrome }}
        run: |
          git -c user.name=github-actions[bot] -c user.email=github-actions[bot]@users.noreply.github.com \
            tag -a -f nightly "$GITHUB_SHA" -m "$(printf '%s chromium@%s\n\n%s\n%s\n' \
              "$REF" "$CHROME" "$SHA" \
              "$(git log -1 --format=%s "$GITHUB_SHA")")"
          git push -f origin refs/tags/nightly

  screenshot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v7
        with:
          name: devtools-frontend.tar.zst
          path: ${{ runner.temp }}

      - run: tar -xaf ${{ runner.temp }}/devtools-frontend.tar.zst -C ${{ runner.temp }}

      - run: scripts/screenshot.sh ${{ runner.temp }}/front_end

      - name: Commit screenshots
        run: |
          git add .github/assets/screenshot-light.png .github/assets/screenshot-dark.png
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions[bot] -c user.email=github-actions[bot]@users.noreply.github.com \
            commit -m "$(cat <<'EOF'
          Update DevTools light and dark screenshots.

          EOF
          )"
          git push
